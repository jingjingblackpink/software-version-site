<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>软件版本管理系统 · 登录</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">📦</div>
    <h1>软件版本管理系统</h1>
    <p class="login-sub">项目版本信息 · README · 资料下载</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <div id="loginError" class="login-error"></div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>

    <p class="login-footer">Powered by GitHub Pages</p>
  </div>

  <script src="data.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.getElementById("username").value.trim();
      var p = document.getElementById("password").value;
      var err = document.getElementById("loginError");
      var user = USERS[u];
      if (user && user.password === p) {
        err.textContent = "";
        sessionStorage.setItem(LOGIN_KEY, JSON.stringify({ username: u, role: user.role }));
        location.href = user.page;
      } else {
        err.textContent = "❌ 用户名或密码错误，请重试";
      }
    });
  </script>
</body>
</html>
