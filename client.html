<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户端 · 软件版本管理系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">📦 软件版本管理 · 项目列表</div>
    <div class="actions">
      <button class="btn-link" id="btnLogout">🚪 退出登录</button>
    </div>
  </div>

  <div class="container">
    <div class="toolbar">
      <div class="search-box">
        <input id="searchInput" placeholder="搜索项目名称 / 版本号 / README…">
      </div>
    </div>

    <div class="list-summary">
      共 <b id="sumProjects">0</b> 个项目 · <b id="sumVersions">0</b> 个版本
      <span class="sum-tip">同名项目已自动归拢为一个卡片，点击卡片标题可展开历史版本</span>
    </div>

    <div id="groupList"></div>

    <p class="hint">💡 点【⬇ 下载】跳转百度网盘（提取码已包含在链接中）；点【📖 说明 / 查看】阅读 README 说明。</p>
  </div>

  <script src="data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
