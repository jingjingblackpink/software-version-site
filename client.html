<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户端 · 软件版本管理系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">📦 软件版本管理 · 项目列表</div>
    <div class="actions">
      <button class="btn-link" id="btnLogout">🚪 退出登录</button>
    </div>
  </div>

  <div class="container">
    <div class="toolbar">
      <div class="search-box">
        <input id="searchInput" placeholder="搜索项目名称 / 版本号 / README…">
      </div>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>项目名称</th>
              <th>上传日期</th>
              <th>版本信息</th>
              <th>屏幕版本</th>
              <th>README 信息</th>
              <th>下载链接</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <p class="hint">💡 点击【⬇ 下载】跳转百度网盘（提取码已包含在链接中）；点击【📖 查看】阅读该项目的 README 说明。</p>
  </div>

  <script src="data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
